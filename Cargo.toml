[workspace]
resolver = "2"
members = ["crates/cadw", "crates/cadw-contract", "crates/cadw-governance"]

[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/tacticaldoll/cadw"
keywords = ["batch-fold", "atomicity", "sans-io", "ledger", "state-machine"]
categories = ["rust-patterns"]
publish = false

[workspace.dependencies]
tianheng = "0.3.0"
cadw-contract = { path = "crates/cadw-contract", version = "0.1.0" }
